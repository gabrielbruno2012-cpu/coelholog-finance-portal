<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Registrar SLA</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="sidebar-container"></div>

<main class="main">
<h1>Registrar SLA</h1>

<div class="card">

  <label>Campanha Ativa</label>
  <select id="campanha"></select>

  <label>Período (Semana)</label>
  <select id="periodo">
    <option>Semana 1</option>
    <option>Semana 2</option>
    <option>Semana 3</option>
    <option>Semana 4</option>
  </select>

  <label>SLA (%)</label>
  <input type="number" id="sla" step="0.01">

  <button class="btn" onclick="registrarSLA()">Registrar</button>

</div>

<div id="lista"></div>

</main>

<script>
fetch('/components/sidebar_admin.html')
  .then(r=>r.text())
  .then(html=>document.getElementById("sidebar-container").innerHTML = html);

async function carregarCampanhaAtiva(){
  const res = await fetch("/api/campanhas/ativa");
  const c = await res.json();
  if(c.id){
    campanha.innerHTML = `<option value='${c.id}'>${c.nome}</option>`;
    carregarSLA(c.id);
  }
}

async function registrarSLA(){
  const payload = {
    campanha_id: campanha.value,
    periodo: periodo.value,
    sla_percentual: sla.value
  };

  await fetch("/api/campanha/sla/registrar",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(payload)
  });

  alert("SLA registrada!");
  carregarSLA(campanha.value);
}

async function carregarSLA(id){
  const res = await fetch("/api/campanha/sla/listar?campanha_id="+id);
  const lista = await res.json();

  let html = "<h2>SLA Registrados</h2><table class='table'><tr><th>Semana</th><th>SLA</th></tr>";
  lista.forEach(r => {
    html += `<tr><td>${r.periodo}</td><td>${r.sla_percentual}%</td></tr>`;
  });
  html += "</table>";

  document.getElementById("lista").innerHTML = html;
}

carregarCampanhaAtiva();
</script>
</body>
</html>
