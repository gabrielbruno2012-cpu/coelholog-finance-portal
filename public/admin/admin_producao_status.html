<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Status das Produções</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- SIDEBAR ADMIN -->
<div id="sidebar-container"></div>

<main class="main">

    <h1>Status das Produções</h1>

    <div class="card">
        <h3>Produções Pendentes</h3>
        <div id="lista"></div>
    </div>

</main>

<script>
// Carrega sidebar do admin
fetch('/admin/sidebar.html')
    .then(r => r.text())
    .then(html => document.getElementById("sidebar-container").innerHTML = html);


// Função para abrir nota enviada
function verNota(nota) {
    if (!nota) {
        alert("Este lançamento não possui nota.");
        return;
    }
    window.open("/uploads/notas/" + nota, "_blank");
}


// APROVAR produção
async function aprovar(id) {
    if (!confirm("Aprovar esta produção?")) return;

    await fetch("/api/producao/aprovar-note/" + id);
    loadPendentes();
}


// RECUSAR produção
async function recusar(id) {
    if (!confirm("Recusar esta produção? O colaborador poderá enviar outra nota.")) return;

    await fetch("/api/producao/recusar-note/" + id);
    loadPendentes();
}
