<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/style.css">
  <title>Status das Produções</title>
</head>

<body>

<div id="sidebar-container"></div>

<main class="main">
  <div class="header-right">
    <button class="btn" onclick="logout()">Logout</button>
  </div>

  <h1>Status das Produções</h1>

  <div class="card">
    <h3>Produções Pendentes</h3>
    <div id="lista-pendentes" style="margin-top:20px;"></div>
  </div>
</main>

<script>
// carregar sidebar
fetch("/components/sidebar_admin.html")
  .then(r => r.text())
  .then(html => document.getElementById("sidebar-container").innerHTML = html);

function logout() {
  localStorage.removeItem("usuario");
  localStorage.removeItem("user");
  window.location = "/";
}

// carregar produções pendentes
async function carregarProducoesPendentes() {
  const res = await fetch("/api/producao/pendentes");
  const dados = await res.json();

  const container = document.getElementById("lista-pendentes");

  if (!dados.length) {
    container.innerHTML = `<p style="text-align:center; color:#ccc;">Nenhuma produção pendente.</p>`;
    return;
  }

  let html = `
    <table class="table">
      <tr>
        <th>ID</th>
        <th>Colaborador</th>
        <th>Data</th>
        <th>Valor</th>
        <th>Nota</th>
        <th>Ações</th>
      </tr>
  `;

  dados.forEach(p => {
    html += `
      <tr>
        <td>P-${p.id}</td>
        <td>${p.colaborador}</td>
        <td>${p.data}</td>
        <td>R$ ${Number(p.total_calculado).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td>
        <td><a href="/uploads/notas/${p.nota}" class="btn-sm" target="_blank">Ver Nota</a></td>
        <td>
          <button class="btn-green" onclick="aprovar(${p.id})">Aprovar</button>
          <button class="btn-red" onclick="reprovar(${p.id})">Reprovar</button>
        </td>
      </tr>
    `;
  });

  html += `</table>`;
  container.innerHTML = html;
}

// APROVAR = usa rota CERTA
async function aprovar(id) {
  if (!confirm("Confirmar aprovação?")) return;

  await fetch(`/api/producao/aprovar-nota/${id}`, {
    method: "PUT"
  });

  alert("Produção aprovada!");
  carregarProducoesPendentes();
}

// RECUSAR = usa rota CERTA
async function reprovar(id) {
  if (!confirm("Confirmar rejeição da nota?")) return;

  await fetch(`/api/producao/recusar-nota/${id}`, {
    method: "PUT"
  });

  alert("Produção recusada!");
  carregarProducoesPendentes();
}

document.addEventListener("DOMContentLoaded", carregarProducoesPendentes);

</script>
</body>
</html>
