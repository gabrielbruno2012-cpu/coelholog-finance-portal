<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Criar Campanha</title>
<link rel="stylesheet" href="/css/style.css">

<style>
body {
    background: #071a2b;
    color: #fff;
}

/* Card principal */
.card {
    background: #0d2040;
    padding: 30px;
    border-radius: 14px;
    max-width: 900px;
    margin: 40px auto;
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
}

/* Inputs padrão */
input, select {
    width: 100%;
    padding: 14px;
    margin-bottom: 18px;
    background: #0c1b33;
    border: 1px solid #123;
    border-radius: 10px;
    color: #fff;
    outline: none;
    font-size: 15px;
}

input::placeholder {
    color: #9bb0c9;
}

/* Botão */
.btn {
    background: #ffd34f;
    color: #000;
    padding: 12px 22px;
    border-radius: 10px;
    border: none;
    font-weight: bold;
    cursor: pointer;
}

.btn:hover {
    background: #ffcc33;
}

/* Tabela */
table {
    width: 100%;
    margin-top: 25px;
    border-collapse: collapse;
}

th, td {
    padding: 14px;
    border-bottom: 1px solid #123;
}

.status-ativa {
    color: #4cff96;
    font-weight: bold;
}

.status-inativa {
    color: #ff6b6b;
    font-weight: bold;
}

.action-btn {
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    border: none;
}

.atv {
    background: #34d16e;
    color: #000;
}

.dst {
    background: #ff5555;
    color: #000;
}
</style>
</head>

<body>

<div id="sidebar-container"></div>

<main>
<div class="card">

    <h1>Criar Campanha</h1>
    <p>Cadastre novas campanhas e gerencie quais estarão ativas.</p>

    <label>Nome da Campanha*</label>
    <input type="text" id="nome" placeholder="Ex: Campanha Fevereiro">

    <label>Meta de SLA (%)*</label>
    <input type="number" id="meta_sla" placeholder="Ex: 95">

    <label>Período*</label>
    <input type="text" id="periodo" placeholder="Ex: 01/02 a 29/02">

    <button class="btn" onclick="criarCampanha()">Criar Campanha</button>

    <hr style="margin:30px 0; border-color:#123;">

    <h2>Campanhas Cadastradas</h2>
    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Meta SLA</th>
                <th>Período</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="listaCampanhas"></tbody>
    </table>

</div>
</main>

<script>
// Sidebar
fetch('/components/sidebar_admin.html')
  .then(r => r.text())
  .then(html => document.getElementById("sidebar-container").innerHTML = html);

// Criar campanha
async function criarCampanha() {
    const payload = {
        nome: nome.value,
        meta_sla: meta_sla.value,
        periodo: periodo.value
    };

    await fetch("/api/campanhas/criar", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
    });

    alert("Campanha criada!");
    carregarCampanhas();
}

// Listar campanhas
async function carregarCampanhas() {
    const res = await fetch("/api/campanhas/listar");
    const lista = await res.json();

    listaCampanhas.innerHTML = "";

    lista.forEach(c => {
        listaCampanhas.innerHTML += `
            <tr>
                <td>${c.nome}</td>
                <td>${c.meta_sla}%</td>
                <td>${c.periodo}</td>
                <td>
                    ${c.ativa == 1 
                        ? "<span class='status-ativa'>ATIVA</span>"
                        : "<span class='status-inativa'>INATIVA</span>"
                    }
                </td>
                <td>
                    ${c.ativa == 1 
                        ? `<button class="action-btn dst" onclick="desativarCampanha()">Desativar</button>`
                        : `<button class="action-btn atv" onclick="ativarCampanha(${c.id})">Ativar</button>`
                    }
                </td>
            </tr>
        `;
    });
}

// Ativar campanha
async function ativarCampanha(id) {
    await fetch("/api/campanhas/ativar", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ id })
    });

    carregarCampanhas();
}

// Desativar campanha (todas)
async function desativarCampanha() {
    await fetch("/api/campanhas/desativar", {
        method: "POST"
    });

    carregarCampanhas();
}

carregarCampanhas();
</script>

</body>
</html>
