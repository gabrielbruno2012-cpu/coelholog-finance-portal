<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Criar Campanha - CoelhoLog</title>
    <link rel="stylesheet" href="../styles.css">

    <style>
        body {
            background-color: #071a33;
            font-family: 'Inter', sans-serif;
            color: #fff;
            margin: 0;
            padding: 20px;
        }

        h2.page-title {
            font-size: 26px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .card {
            background: #0c2852;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px #00000040;
            max-width: 900px;
            margin-bottom: 30px;
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .form-group label {
            font-size: 14px;
            margin-bottom: 6px;
            color: #d7e3f5;
        }

        input {
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #163864;
            color: #ffffff;
            font-size: 15px;
        }

        input::placeholder {
            color: #9bb5d4;
        }

        .btn-primary {
            background: #ffcc00;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            color: #000;
            font-weight: 700;
            width: 220px;
        }

        .btn-primary:hover {
            background: #e6b800;
        }

        .form-message {
            margin-top: 10px;
            font-size: 15px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <h2 class="page-title">Criar Nova Campanha</h2>

    <div class="card">
        <form id="formCriarCampanha" class="form-grid">

            <div class="form-group">
                <label>Nome da Campanha *</label>
                <input type="text" id="campNome" required placeholder="Ex: Zero Ocorrências">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Data de Início *</label>
                    <input type="date" id="campInicio" required>
                </div>

                <div class="form-group">
                    <label>Data de Fim *</label>
                    <input type="date" id="campFim" required>
                </div>

                <div class="form-group">
                    <label>Meta de SLA (%)</label>
                    <input type="number" id="campMeta" min="0" max="100" step="0.1" placeholder="Ex: 95">
                </div>
            </div>

            <div class="form-group">
                <label>Tema da Campanha</label>
                <input type="text" id="campTema" placeholder="Ex: Entrega Perfeita, Zero Falhas...">
            </div>

            <button class="btn-primary" type="submit">Criar Campanha</button>

            <p id="msgCampanha" class="form-message"></p>

        </form>
    </div>

    <script>
        document
            .getElementById("formCriarCampanha")
            .addEventListener("submit", async (e) => {
                e.preventDefault();

                const data = {
                    nome: document.getElementById("campNome").value,
                    periodo_inicio: document.getElementById("campInicio").value,
                    periodo_fim: document.getElementById("campFim").value,
                    meta_sla: Number(document.getElementById("campMeta").value || 0),
                    tema: document.getElementById("campTema").value
                };

                const msg = document.getElementById("msgCampanha");
                msg.textContent = "Criando campanha...";
                msg.style.color = "#ffcc00";

                try {
                    const req = await fetch("/api/campanhas/criar", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(data)
                    });

                    const res = await req.json();

                    if (!res.ok) {
                        msg.textContent = res.erro || "Erro ao criar campanha.";
                        msg.style.color = "#ff4d4d";
                        return;
                    }

                    msg.textContent = "Campanha criada com sucesso!";
                    msg.style.color = "#00e676";

                    document.getElementById("formCriarCampanha").reset();

                } catch (err) {
                    msg.textContent = "Erro de comunicação com o servidor.";
                    msg.style.color = "#ff4d4d";
                }
            });
    </script>

</body>
</html>
