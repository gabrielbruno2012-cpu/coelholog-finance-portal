<style>
/* Sidebar container */
.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  width: 230px;
  height: 100vh;
  background: #0c1b33;
  padding-top: 20px;
  transition: width 0.25s ease;
  overflow: hidden;
  z-index: 999;
}

.sidebar.collapsed {
  width: 70px;
}

/* Toggle button */
.sidebar-toggle {
  position: absolute;
  top: 15px;
  right: -15px;
  background: #ffd34f;
  color: #000;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-weight: bold;
}

/* Menu */
.sidebar ul {
  list-style: none;
  padding: 0;
  margin-top: 60px;
}

.sidebar ul li {
  margin-bottom: 15px;
}

.sidebar a {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 18px;
  color: #fff;
  text-decoration: none;
  font-size: 15px;
  white-space: nowrap;
  transition: opacity .2s;
}

.sidebar.collapsed a span {
  display: none;
}

.sidebar a:hover {
  background: #0f2344;
}

/* Icons only mode */
.sidebar.collapsed a {
  justify-content: center;
  padding: 12px 0;
}
</style>

<div id="sidebar" class="sidebar">
  <div class="sidebar-toggle" onclick="toggleSidebar()">☰</div>

  <ul>
    <li><a href="/colaborador/dashboard.html">🏠 <span>Dashboard</span></a></li>
    <li><a href="/colaborador/recebiveis.html">💰 <span>Recebíveis</span></a></li>
    <li><a href="/colaborador/producao.html">📦 <span>Produção</span></a></li>
    <li><a href="/colaborador/emprestimos.html">💳 <span>Empréstimos</span></a></li>
    <li><a href="/colaborador/incentivos.html">🎯 <span>Incentivos & Metas</span></a></li>
    <li><a href="/logout">🚪 <span>Sair</span></a></li>
  </ul>
</div>

<script>
// Restore saved state
document.addEventListener("DOMContentLoaded", () => {
  const sidebar = document.getElementById("sidebar");
  const saved = localStorage.getItem("sidebar-collapsed");

  if (saved === "true") {
    sidebar.classList.add("collapsed");
  }
});

function toggleSidebar() {
  const sidebar = document.getElementById("sidebar");
  sidebar.classList.toggle("collapsed");

  // Save state
  localStorage.setItem(
    "sidebar-collapsed",
    sidebar.classList.contains("collapsed")
  );
}
</script>
