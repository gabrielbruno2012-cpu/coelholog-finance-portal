<style>
/* ==== SIDEBAR ==== */
.sidebar-colab {
    position: fixed;
    top: 0;
    left: 0;
    width: 230px;
    height: 100vh;
    background: #07172b;
    padding-top: 20px;
    transition: width .25s ease;
    z-index: 1000;
    overflow: hidden;
}

.sidebar-colab.collapsed {
    width: 70px;
}

/* ==== BOTÃO DE ABRIR/FECHAR ==== */
.sidebar-toggle-colab {
    position: absolute;
    top: 15px;
    right: -15px;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #ffd34f;
    color: #000;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 2000;
}

/* ==== LISTA ==== */
.sidebar-colab ul {
    list-style: none;
    padding: 0;
    margin-top: 60px;
}

.sidebar-colab ul li {
    margin-bottom: 5px;
}

.sidebar-colab a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    color: #fff;
    text-decoration: none;
    font-size: 15px;
    white-space: nowrap;
    transition: all .2s;
}

.sidebar-colab a:hover {
    background: #0f2344;
}

/* Oculta texto quando recolhido */
.sidebar-colab.collapsed a span {
    display: none;
}

/* Centraliza ícones quando recolhido */
.sidebar-colab.collapsed a {
    justify-content: center;
    padding: 12px 0;
}
</style>

<div id="sidebarColab" class="sidebar-colab">

    <div class="sidebar-toggle-colab" onclick="toggleSidebarColab()">☰</div>

    <ul>
        <li><a href="/colaborador/dashboard.html">🏠 <span>Dashboard</span></a></li>
        <li><a href="/colaborador/recebiveis.html">💰 <span>Recebíveis</span></a></li>
        <li><a href="/colaborador/producao.html">📦 <span>Produção</span></a></li>
        <li><a href="/colaborador/emprestimos.html">💳 <span>Empréstimos</span></a></li>
        <li><a href="/colaborador/incentivos.html">🎯 <span>Incentivos & Metas</span></a></li>
        <li><a href="/logout">🚪 <span>Sair</span></a></li>
    </ul>
</div>

<script>
// Carregar estado salvo
document.addEventListener("DOMContentLoaded", () => {
    const sidebar = document.getElementById("sidebarColab");
    const saved = localStorage.getItem("sidebarColabCollapsed");

    if (saved === "true") {
        sidebar.classList.add("collapsed");
    }
});

// Alternar estado
function toggleSidebarColab() {
    const sidebar = document.getElementById("sidebarColab");
    sidebar.classList.toggle("collapsed");

    localStorage.setItem(
        "sidebarColabCollapsed",
        sidebar.classList.contains("collapsed")
    );
}
</script>
