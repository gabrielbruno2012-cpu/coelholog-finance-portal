<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Incentivos & Metas</title>
<link rel="stylesheet" href="/css/style.css">

<style>
/* Layout geral */
.main {
  padding: 30px;
  color: #fff;
}

.card {
  background: #0c1b33;
  border-radius: 12px;
  padding: 25px;
  margin-bottom: 25px;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

.card h2 {
  margin-top: 0;
  font-size: 20px;
}

/* Cards superiores */
.top-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}

.top-card {
  background: #0d2040;
  padding: 20px;
  border-radius: 12px;
}

.top-card .value {
  font-size: 26px;
  font-weight: bold;
  color: #ffd34f;
}

/* Barra de progresso */
.progress-bar {
  width: 100%;
  height: 10px;
  border-radius: 5px;
  background: #334;
  margin-top: 10px;
}

.progress {
  height: 10px;
  border-radius: 5px;
  background: #ffd34f;
  width: 0%;
}

/* Ranking */
.ranking-item {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid #223;
}

/* Bônus */
.bonus-item {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
}

  border-radius: 12px;
