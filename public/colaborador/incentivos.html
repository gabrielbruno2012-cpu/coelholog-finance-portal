<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Incentivos | CoelhoLog</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            background: #061b34;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }

        .inc-container {
            padding: 30px;
            max-width: 1200px;
            margin: auto;
        }

        .inc-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .inc-top-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .inc-card {
            background: #0d2a4d;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0px 6px 20px rgba(0,0,0,0.2);
        }

        .inc-card-title {
            font-size: 16px;
            opacity: .8;
        }

        .inc-card-value {
            margin-top: 10px;
            font-size: 32px;
            font-weight: bold;
        }

        .inc-progress {
            margin-top: 15px;
            width: 100%;
            height: 10px;
            background: #10345d;
            border-radius: 10px;
            overflow: hidden;
        }

        .inc-progress-bar {
            height: 100%;
            width: 0%;
            background: #ffd000;
            transition: .6s;
        }

        .inc-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            background: #ffd000;
            padding: 8px 14px;
            border-radius: 50px;
            font-size: 14px;
            color: #000;
            font-weight: 600;
        }

        .inc-history {
            margin-top: 35px;
            background: #0d2a4d;
            padding: 20px;
            border-radius: 12px;
        }

        .history-row {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

<div class="inc-container">

    <div class="inc-title">Incentivos do Colaborador</div>

    <!-- TOP CARDS -->
    <div class="inc-top-grid">
        
        <div class="inc-card">
            <div class="inc-card-title">Total de Pontos</div>
            <div id="pontosValue" class="inc-card-value">0 pts</div>
            <div class="inc-progress">
                <div id="progressBar" class="inc-progress-bar"></div>
            </div>
        </div>

        <div class="inc-card">
            <div class="inc-card-title">Meta Mensal</div>
            <div id="metaValue" class="inc-card-value">1000 pts</div>
            <div id="campaignName" class="inc-pill"><span class="inc-pill-badge"></span>Aguardando...</div>
        </div>

        <div class="inc-card">
            <div class="inc-card-title">SLA do Período</div>
            <div id="slaValue" class="inc-card-value">--%</div>
        </div>
    </div>

    <!-- HISTÓRICO -->
    <div class="inc-history">
        <h3>Histórico de Pontos</h3>
        <div id="historyList"></div>
    </div>

</div>

<script>
const user = JSON.parse(localStorage.getItem("usuario"));
const userId = user?.id;

// =========================================================
//   1. CARREGA PONTOS DO COLABORADOR
// =========================================================
fetch(`/api/incentivos/pontos/${userId}`)
    .then(r => r.json())
    .then(data => {
        const pontos = data?.points || 0;
        const meta = 1000; // meta fixa ou dinâmica futuramente

        document.getElementById("pontosValue").innerHTML = `${pontos} pts`;
        document.getElementById("metaValue").innerHTML = `${meta} pts`;

        const progress = Math.min((pontos / meta) * 100, 100);
        document.getElementById("progressBar").style.width = progress + "%";
    });


// =========================================================
//   2. CARREGA CAMPANHAS ATIVAS
// =========================================================
fetch(`/api/incentivos/campanhas`)
    .then(r => r.json())
    .then(campanhas => {
        if (!campanhas.length) return;
        document.getElementById("campaignName").innerHTML =
            `<span class='inc-pill-badge'></span> ${campanhas[0].title}`;
    });


// =========================================================
//   3. SLA ATUAL DO PERÍODO
// =========================================================
fetch(`/api/incentivos/sla`)
    .then(r => r.json())
    .then(s => {
        if (!s?.length) return;
        document.getElementById("slaValue").innerHTML = s[0].sla_percent + "%";
    });


// =========================================================
//   4. HISTÓRICO DO COLABORADOR
// =========================================================
fetch(`/api/incentivos/historico/${userId}`)
    .then(r => r.json())
    .then(rows => {
        const historyDiv = document.getElementById("historyList");
        historyDiv.innerHTML = "";

        if (!rows.length) {
            historyDiv.innerHTML = "<p>Nenhum histórico encontrado.</p>";
            return;
        }

        rows.forEach(h => {
            historyDiv.innerHTML += `
                <div class="history-row">
                    <b>+${h.points} pts</b> — ${h.description} <br>
                    <span style="opacity:.6">${h.created_at}</span>
                </div>`;
        });
    });
</script>

</body>
</html>
