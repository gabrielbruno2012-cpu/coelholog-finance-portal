<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard Colaborador</title>
<link rel="stylesheet" href="/css/style.css">
<style>
/* BOTÃO MENU */
#menuToggle {
    font-size: 22px;
    cursor: pointer;
    padding: 10px;
    position: absolute;
    left: 10px;
    top: 10px;
    color: #fff;
    z-index: 9999;
}
.sidebar.collapsed {
    width: 60px;
}
.sidebar.collapsed .label-text {
    display: none;
}
</style>
</head>
<body>

<div id="sidebar-container"></div>

<span id="menuToggle">☰</span>

<main class="main">
    <h1 id="welcome">Bem-vindo</h1>

    <div class="top-cards">
        <div class="card">
            <h4>Total Recebido</h4>
            <div id="total_recebido">R$ 0,00</div>
        </div>

        <div class="card">
            <h4>Total Pendente</h4>
            <div id="total_pendente">R$ 0,00</div>
        </div>

        <div class="card">
            <h4>Em Processamento</h4>
            <div id="total_processando">R$ 0,00</div>
        </div>
    </div>

    <div class="card">
        <h3>Ganhos no Mês</h3>
        <div id="ganhos_mes">Carregando...</div>
    </div>

    <div class="card">
        <h3>Recebíveis</h3>
        <div id="lista"></div>
    </div>
</main>

<script>
// ============================
// CARREGAR SIDEBAR
// ============================
fetch("/components/sidebar_colaborador.html")
.then(r => r.text())
.then(html => {
    document.getElementById("sidebar-container").innerHTML = html;

    // botão recolher menu
    document.getElementById("menuToggle").addEventListener("click", () => {
        document.querySelector(".sidebar").classList.toggle("collapsed");
    });
});

// ============================
// DADOS DO USUÁRIO
// ============================
const rawUser = localStorage.getItem("user") || localStorage.getItem("usuario");
if (!rawUser) window.location = "/";
const user = JSON.parse(rawUser);

document.getElementById("welcome").innerText = `Bem-vindo, ${user.nome.toUpperCase()}`;

// ============================
// CARREGAR RECEBÍVEIS + PRODUÇÃO
// ============================
async function loadDados() {
    const hoje = new Date();
    const mes = String(hoje.getMonth() + 1).padStart(2, "0");
    const ano = hoje.getFullYear();

    const [recRes, prodRes] = await Promise.all([
        fetch(`/api/recebiveis?user_id=${user.id}`),
        fetch(`/api/producao/colaborador?usuario_id=${user.id}&mes=${mes}&ano=${ano}`)
    ]);

    let recebiveis = await recRes.json();
    let producoes = await prodRes.json();

    if (!Array.isArray(producoes)) producoes = [];

    // Converter produções para mesma estrutura
    const producaoConvertida = producoes.map(p => ({
        id: "P-" + p.id,
        data: p.data,
        valor: p.total_calculado || 0,
        tipo: "Produção",
        status: p.nota_status || "pendente"
    }));

    const todos = [...recebiveis, ...producaoConvertida];

    renderTabela(todos);
    calcularTotais(todos);
}

// ============================
// RENDERIZAR TABELA
// ============================
function renderTabela(lista) {
    if (lista.length === 0) {
        document.getElementById("lista").innerHTML = "<p>Nenhum recebível encontrado.</p>";
        return;
    }

    let html = `
        <table class="table">
            <tr>
                <th>ID</th><th>Data</th><th>Valor</th><th>Tipo</th><th>Status</th>
            </tr>
    `;

    lista.forEach(r => {
        html += `
            <tr>
                <td>${r.id}</td>
                <td>${r.data}</td>
                <td>R$ ${Number(r.valor).toFixed(2)}</td>
                <td>${r.tipo}</td>
                <td>${r.status}</td>
            </tr>
        `;
    });

    html += "</table>";
    document.getElementById("lista").innerHTML = html;
}

// ============================
// CALCULAR TOTAIS DOS CARDS
// ============================
function calcularTotais(lista) {
    let total = 0, pend = 0, proc = 0;

    lista.forEach(r => {
        const v = Number(r.valor) || 0;
        const st = (r.status || "").toLowerCase();

        if (st.includes("pago") || st.includes("aprov")) {
            total += v;
        } 
        else if (st.includes("pend")) {
            pend += v;
        } 
        else if (st.includes("process")) {
            proc += v;
        }
    });

    document.getElementById("total_recebido").innerText = `R$ ${total.toFixed(2)}`;
    document.getElementById("total_pendente").innerText = `R$ ${pend.toFixed(2)}`;
    document.getElementById("total_processando").innerText = `R$ ${proc.toFixed(2)}`;
}

document.addEventListener("DOMContentLoaded", loadDados);
</script>

</body>
</html>
